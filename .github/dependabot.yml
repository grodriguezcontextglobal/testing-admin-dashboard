# Actualizaciones de dependencias (FedRAMP C3 · RA-5, SI-2).
# Dependabot abre un PR por grupo; la CI corre en cada PR, incluida la puerta
# de audit (scripts/audit-gate.js). Los saltos de versión mayor van en su propio
# PR, porque necesitan revisión (p. ej. Vite 5 -> 6).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # Las actions van fijadas por SHA (C7); Dependabot actualiza el SHA y el
  # comentario de versión.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"

  # Dockerfile.dev: la imagen base de Node.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
