# Actualizaciones de dependencias (FedRAMP C3 · RA-5, SI-2).
# Dependabot abre un PR por grupo; la CI corre en cada PR, incluida la puerta
# de audit (scripts/audit-gate.js). Los saltos de versión mayor van en su propio
# PR, porque necesitan revisión (p. ej. Vite 5 -> 6).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Las versiones mayores (antd, MUI, react-redux, Vite...) son migraciones:
    # se planifican y se hacen a mano, no como PR automático. Los avisos de
    # seguridad siguen llegando, y la puerta de audit de la CI bloquea igual
    # cualquier high/critical en producción.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # 0.5 exige ESLint 9; seguimos en ESLint 8 (rompe npm ci, PR #22).
      - dependency-name: eslint-plugin-react-refresh
        versions:
          - ">=0.5.0"
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # Las actions van fijadas por SHA (C7); Dependabot actualiza el SHA y el
  # comentario de versión.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"

  # Dockerfile.dev: la imagen base de Node. El salto de versión mayor de Node
  # se hace a mano, junto con la CI (setup-node), que usa la misma versión.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
