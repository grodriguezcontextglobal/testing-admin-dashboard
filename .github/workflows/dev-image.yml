name: Publish Dev Image

on:
  push:
    branches:
      - main
    paths:
      # Solo reconstruir cuando cambien las dependencias, no el código fuente.
      # Los cambios de código fuente llegan a los devs vía git pull + hot-reload.
      - package.json
      - package-lock.json
      - Dockerfile.dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: grodriguezcontextglobal/devitrak-client-dev

jobs:
  # La imagen solo se publica si pasa la puerta de CI.
  checks:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & push dev image
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile.dev
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Cache entre builds: usa la capa de dependencias del push anterior
          # para evitar npm ci completo en cada ejecución.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
