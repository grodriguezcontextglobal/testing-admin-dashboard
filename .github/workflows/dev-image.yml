name: Publish Dev Image

on:
  push:
    branches:
      - main
    paths:
      # Solo reconstruir cuando cambien las dependencias, no el código fuente.
      # Los cambios de código fuente llegan a los devs vía git pull + hot-reload.
      - package.json
      - package-lock.json
      - Dockerfile.dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: grodriguezcontextglobal/devitrak-client-dev

jobs:
  # La imagen solo se publica si pasa la puerta de CI.
  checks:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & push dev image
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.dev
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Cache entre builds: usa la capa de dependencias del push anterior
          # para evitar npm ci completo en cada ejecución.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
