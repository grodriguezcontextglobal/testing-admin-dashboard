name: CodeQL

# Análisis estático con reglas de seguridad (FedRAMP C6 · SA-11, RA-5).
# Gratis porque el repo es público. Los hallazgos salen en Security → Code
# scanning y, en una PR, como anotaciones sobre las líneas cambiadas.
# Se analiza el JavaScript del dashboard y los propios workflows (actions).
on:
  push:
    branches:
      - main
  pull_request:
  # Una pasada semanal recoge las reglas nuevas aunque no cambie el código.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sin build: CodeQL lee el código fuente directamente. security-extended
      # añade a las reglas por defecto las de severidad media y baja.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
