name: CI

# Puerta de calidad (FedRAMP F1.3): lint, tests unitarios y build en cada push
# a main. dev-image.yml la llama antes de publicar la imagen.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

# github.workflow es el del llamador cuando dev-image.yml reutiliza este fichero:
# así su ejecución no cancela la de este mismo push, ni al revés.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Los tests unitarios no necesitan el binario de Cypress.
      CYPRESS_INSTALL_BINARY: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Todo el historial, para el escaneo de secretos.
          fetch-depth: 0

      # Escaneo de secretos (FedRAMP C5 · IA-5, SA-11): gitleaks recorre todo el
      # historial (unos 20 s). .gitleaksignore lista los hallazgos antiguos ya
      # revisados; cualquier otro bloquea. El binario se baja de la release
      # oficial y se comprueba contra su SHA-256, como las actions fijadas por SHA.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # La misma versión que Dockerfile.dev.
          node-version: 24.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Puerta de dependencias (FedRAMP A1 · RA-5): un aviso high o critical en
      # las dependencias de producción bloquea, salvo que
      # .github/audit-exceptions.json lo acepte con motivo y fecha de caducidad.
      - name: Dependency audit
        run: node scripts/audit-gate.js

      # El mismo SBOM que release.yml adjunta a cada release (FedRAMP C4), para
      # que una PR que lo rompa falle antes de llegar a main.
      - name: SBOM
        run: |
          npm sbom --omit dev --package-lock-only --sbom-format cyclonedx --sbom-type application > "$RUNNER_TEMP/sbom.json"
          node scripts/sbom-stamp.js "$RUNNER_TEMP/sbom.json" "ci-${GITHUB_SHA::7}" admin-sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.run_id }}
          path: admin-sbom.cdx.json
          retention-days: 90

      # Puerta de lint (FedRAMP F1.3 / C2): cero avisos desde el 2026-11-05
      # (eran 281 el 21-10, bajados por tandas). Es el mismo comando que
      # `npm run lint`: cualquier aviso nuevo, o un eslint-disable que ya no
      # haga falta, rompe la CI.
      - name: Lint
        run: npm run lint

      # Con cobertura (FedRAMP C8 · SA-11): el informe queda como artefacto de
      # cada ejecución, como evidencia de qué cubren los tests.
      - name: Unit tests
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 90
          if-no-files-found: warn

      # Linux distingue mayúsculas en las rutas de import; Windows no. Valores
      # de relleno: vite.config.js exige las variables (src/config/envValidation.js),
      # y aquí solo se comprueba que el build compila.
      - name: Build
        run: npm run build
        env:
          VITE_APP_DEVITRACK_API: https://ci.invalid
          VITE_APP_PUBLIC_STRIPE_KEY: pk_test_ci
