name: CI

# Puerta de calidad (FedRAMP F1.3): lint, tests unitarios y build en cada push
# a main. dev-image.yml la llama antes de publicar la imagen.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

# github.workflow es el del llamador cuando dev-image.yml reutiliza este fichero:
# así su ejecución no cancela la de este mismo push, ni al revés.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Los tests unitarios no necesitan el binario de Cypress.
      CYPRESS_INSTALL_BINARY: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # La misma versión que Dockerfile.dev.
          node-version: 20.19.5
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Puerta de dependencias (FedRAMP A1 · RA-5): un aviso high o critical en
      # las dependencias de producción bloquea, salvo que
      # .github/audit-exceptions.json lo acepte con motivo y fecha de caducidad.
      - name: Dependency audit
        run: node scripts/audit-gate.js

      # Puerta con línea base (FedRAMP F1.3): los errores bloquean, y los
      # warnings no pueden pasar de la línea base (281 el 2026-10-21: 268 de
      # react-hooks/exhaustive-deps y 13 de react-refresh; 280 el 26-10). Al arreglar una
      # tanda, bajar este número en el mismo commit; la meta sigue siendo
      # `npm run lint` (--max-warnings 0).
      - name: Lint
        run: npx eslint . --ext js,jsx --max-warnings 280

      # Con cobertura (FedRAMP C8 · SA-11): el informe queda como artefacto de
      # cada ejecución, como evidencia de qué cubren los tests.
      - name: Unit tests
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 90
          if-no-files-found: warn

      # Linux distingue mayúsculas en las rutas de import; Windows no. Valores
      # de relleno: vite.config.js exige las variables (src/config/envValidation.js),
      # y aquí solo se comprueba que el build compila.
      - name: Build
        run: npm run build
        env:
          VITE_APP_DEVITRACK_API: https://ci.invalid
          VITE_APP_PUBLIC_STRIPE_KEY: pk_test_ci
